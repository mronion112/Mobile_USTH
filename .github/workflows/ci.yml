name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frontend guides and CI hygiene
        run: python3 scripts/ci/check-docs.py

  android-build:
    needs: docs-validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: assemble
            tasks: assembleDebug
          - name: verify
            tasks: testDebugUnitTest lintDebug
    steps:
      - uses: actions/checkout@v4
      - id: gradle
        name: Detect Gradle wrapper
        run: |
          if [ -f gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gradle.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@v4
      - if: steps.gradle.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.gradle.outputs.present == 'true'
        uses: android-actions/setup-android@v3
      - if: steps.gradle.outputs.present == 'true'
        name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - if: steps.gradle.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - if: steps.gradle.outputs.present == 'true'
        name: Gradle ${{ matrix.tasks }}
        run: ./gradlew --no-daemon --stacktrace ${{ matrix.tasks }}
      - if: steps.gradle.outputs.present != 'true'
        run: echo "No Gradle wrapper yet; skipping Android build."
      - if: failure() && steps.gradle.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.name }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  security-scan:
    needs: docs-validate
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
