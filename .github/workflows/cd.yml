name: cd

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        default: debug
        options: [debug, release]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-24.04
    env:
      VARIANT: ${{ github.ref_type == 'tag' && 'release' || inputs.variant || 'debug' }}
    steps:
      - uses: actions/checkout@v5
      - id: gradle
        name: Detect Gradle wrapper
        run: |
          if [ -f gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gradle.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@v5
      - if: steps.gradle.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.gradle.outputs.present == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - if: steps.gradle.outputs.present == 'true'
        name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - if: steps.gradle.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v5
      - if: steps.gradle.outputs.present == 'true' && env.VARIANT == 'release'
        name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is not set; the release build stays unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - if: steps.gradle.outputs.present == 'true'
        name: Assemble ${{ env.VARIANT }} artifact
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$VARIANT" = "release" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
          else
            ./gradlew --no-daemon --stacktrace assembleDebug
          fi
      - if: steps.gradle.outputs.present != 'true'
        run: echo "No Gradle wrapper yet; nothing to assemble."
      - if: steps.gradle.outputs.present == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: app-${{ env.VARIANT }}-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: ${{ env.VARIANT == 'release' && 90 || 14 }}
